labels:
  backend: local

steps:
  - name: lint
    image: bash
    commands:
      - npm ci
      - npm run lint

  - name: typecheck
    image: bash
    commands:
      - npm ci
      - npx tsc --noEmit

  - name: react-doctor
    image: bash
    commands:
      - npm ci
      - npm run react-doctor

  - name: test-unit
    image: bash
    commands:
      - npm ci
      - npm run test


  - name: deploy
    image: bash
    when:
      - event: push
        branch: main
    commands:
      - cd /home/fivem/apps/studios-web
      - chmod +x ./deploy.sh
      - ./deploy.sh
