steps:
  - name: lint
    image: node:20
    when:
      - event: [push, pull_request]
    commands:
      - npm ci
      - npm run lint

  - name: typecheck
    image: node:20
    when:
      - event: [push, pull_request]
    commands:
      - npm ci
      - npx tsc --noEmit

  - name: react-doctor
    image: node:20
    when:
      - event: [push, pull_request]
    commands:
      - npm ci
      - npm run react-doctor

  - name: test-unit
    image: node:20
    when:
      - event: [push, pull_request]
    commands:
      - npm ci
      - npm run test

  - name: deploy
    image: alpine
    when:
      - event: push
        branch: main
    volumes:
      - /home/fivem/.ssh/woodpecker_deploy:/woodpecker_ssh_key:ro
    commands:
      - apk add --no-cache openssh-client
      - cp /woodpecker_ssh_key /tmp/ssh_key && chmod 600 /tmp/ssh_key
      - ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no fivem@172.18.0.1 "bash /home/fivem/apps/studios-web/deploy.sh"
