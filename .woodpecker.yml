labels:
  backend: local

steps:
  - name: install
    image: node:20-alpine
    commands:
      - npm ci

  - name: lint
    image: node:20-alpine
    commands:
      - npm run lint

  - name: typecheck
    image: node:20-alpine
    commands:
      - npx tsc --noEmit

  - name: react-doctor
    image: node:20-alpine
    commands:
      - npm run react-doctor

  - name: test-unit
    image: node:20-alpine
    commands:
      - npm run test

  - name: test-e2e
    image: mcr.microsoft.com/playwright:v1.45.0-jammy
    commands:
      - npm ci
      - npx playwright install-deps
      - npm run test:e2e

  - name: deploy
    image: bash
    when:
      - event: push
        branch: main
    commands:
      - cd /home/fivem/apps/studios-web
      - chmod +x ./deploy.sh
      - ./deploy.sh
