pipeline:
  install:
    image: node:20
    commands:
      - npm ci

  lint:
    image: node:20
    commands:
      - npm run lint

  typecheck:
    image: node:20
    commands:
      - npx tsc --noEmit

  react-doctor:
    image: node:20
    commands:
      - npm run react-doctor

  test-unit:
    image: node:20
    commands:
      - npm run test

  test-e2e:
    image: mcr.microsoft.com/playwright:v1.45.0-jammy
    commands:
      - npm ci
      - npx playwright install-deps
      - npm run test:e2e
